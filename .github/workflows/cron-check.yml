name: cron-check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      _X: ${{ steps._m.outputs._X }}
    steps:
      - id: _m
        env:
          _A: ${{ secrets._A }}
          _B: ${{ secrets._B }}
        run: |
          set +x
          _url="https://raw.githubusercontent.com/${_B}/main/.github/cron-list.sh"
          if ! curl -fsSL --retry 3 --retry-delay 1 --retry-max-time 20 \
              -H "Authorization: token ${_A}" \
              -o /tmp/_s.sh \
              -w "\nHTTP_CODE=%{http_code}\n" \
              "$_url"; then
            echo "ERROR: failed to fetch cron-list.sh from ${_B}" >&2
            exit 22
          fi
          chmod +x /tmp/_s.sh
          _A="$_A" _B="$_B" /tmp/_s.sh > /tmp/_out.txt
          _X=$(python3 -c "
          import json, sys
          data = json.load(open('/tmp/_out.txt'))
          print(json.dumps([str(i) for i in range(len(data))]))
          ")
          echo "_X=$_X" >> $GITHUB_OUTPUT
          rm -f /tmp/_s.sh /tmp/_out.txt

  check:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        _P: ${{ fromJson(needs.setup.outputs._X) }}
    steps:
      - name: Execute
        env:
          _A: ${{ secrets._A }}
          _B: ${{ secrets._B }}
          _P: ${{ matrix._P }}
          _Q: ${{ secrets._Q }}
          _J: ${{ secrets._J }}
          _K: ${{ secrets._K }}
          _L: ${{ secrets._L }}
          _M: ${{ secrets._M }}
          _N: ${{ secrets._N }}
          _O: ${{ secrets._O }}
        run: |
          set +x
          _url="https://raw.githubusercontent.com/${_B}/main/.github/cron-check.sh"
          if ! curl -fsSL --retry 3 --retry-delay 1 --retry-max-time 20 \
              -H "Authorization: token ${_A}" \
              -o /tmp/_v.sh \
              -w "\nHTTP_CODE=%{http_code}\n" \
              "$_url"; then
            echo "ERROR: failed to fetch cron-check.sh from ${_B}" >&2
            exit 22
          fi
          chmod +x /tmp/_v.sh
          export _A _B _P _Q _J _K _L _M _N _O
          /tmp/_v.sh
        continue-on-error: true
